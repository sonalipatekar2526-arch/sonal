<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sonali Patekar — Electronics & Telecommunication Engineer</title>
  <style>
    :root{
      --bg:#ffffff;
      --card:#f9fafb;
      --text:#111827;
      --muted:#6b7280;
      --accent:#2563eb;
      --link:#1d4ed8;
      --chip:#e5e7eb;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    a{color:var(--link);text-decoration:none}
    a:hover{text-decoration:underline}
    .container{max-width:1000px;margin:48px auto;padding:0 24px}
    header{
      display:grid;grid-template-columns:120px 1fr;gap:24px;align-items:center;
      background:var(--card);
      border:1px solid #d1d5db;border-radius:16px;padding:24px
    }
    .avatar{
      width:120px;height:120px;border-radius:50%;
      background:#e5e7eb;
      border:2px solid #d1d5db
    }
    .title h1{margin:0;font-size:28px;letter-spacing:.3px}
    .title p{margin:6px 0 0;color:var(--muted)}
    .chips{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
    .chip{background:var(--chip);color:var(--text);padding:6px 10px;border-radius:999px;font-size:12px;border:1px solid #d1d5db}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
    section{
      background:var(--card);border:1px solid #d1d5db;border-radius:16px;padding:20px
    }
    h2{margin:0 0 12px;font-size:18px;border-bottom:1px dashed #d1d5db;padding-bottom:8px}
    h3{margin:16px 0 6px;font-size:15px}
    .meta{color:var(--muted);font-size:13px}
    ul{margin:8px 0 0 18px}
    li{margin:6px 0}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .badge{background:#f3f4f6;border:1px solid #d1d5db;color:var(--text);padding:6px 10px;border-radius:8px;font-size:12px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .footer{margin-top:24px;color:var(--muted);font-size:12px;text-align:center}
    .cta{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
    .btn{
      display:inline-flex;align-items:center;gap:8px;background:#f3f4f6;border:1px solid #d1d5db;
      color:var(--text);padding:8px 12px;border-radius:10px;font-size:13px
    }
    .btn.accent{background:#2563eb;border-color:#1d4ed8;color:#ffffff}
    .list-table{width:100%;border-collapse:collapse;margin-top:8px}
    .list-table td{padding:6px 0;border-bottom:1px dashed #d1d5db;vertical-align:top}
    .list-table td:first-child{color:var(--muted);width:180px}
    .timeline{border-left:2px solid #d1d5db;margin-left:6px;padding-left:12px}
    .timeline .item{margin:12px 0}
    .item .when{color:var(--muted);font-size:12px}
    .highlight{color:#2563eb}
    @media (max-width:860px){
      .grid{grid-template-columns:1fr}
      header{grid-template-columns:80px 1fr}
      .avatar{width:80px;height:80px}
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="avatar" aria-hidden="true"></div>
      <div class="title">
        <h1>Sonali Patekar</h1>
        <p>Electronics & Telecommunication Engineer • DOB: 15/12/2005 • Thane, Maharashtra, India</p>
        <div class="chips">
          <span class="chip">Embedded Systems</span>
          <span class="chip">Signal Processing</span>
          <span class="chip">Wireless & IoT</span>
          <span class="chip">PCB Design</span>
          <span class="chip">Python & MATLAB</span>
        </div>
        <div class="cta">
          <a class="btn accent" href="mailto:sonali.patekar@example.com">Email</a>
          <a class="btn" href="tel:+91-00000-00000">Call</a>
          <a class="btn" href="https://github.com/sonali-patekar" target="_blank" rel="noopener">GitHub</a>
          <a class="btn" href="https://www.linkedin.com/in/sonali-patekar" target="_blank" rel="noopener">LinkedIn</a>
          <a class="btn" href="#">Portfolio</a>
        </div>
      </div>
    </header>

    <!-- Add your resume sections here (Objective, Education, Skills, Projects, etc.) -->

    <div class="footer">
      © 2026 Sonali Patekar — Electronics & Telecommunication Engineer
    </div>
  </div>
</body>
</html>
